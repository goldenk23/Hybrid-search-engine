name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # All commands run inside the package directory where pyproject.toml lives.
        working-directory: hybrid-search-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check src tests scripts Benchmark

      - name: Run tests
        run: pytest -q

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hybrid-search-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra metrics
      - name: Lint
        run: uv run ruff check src tests scripts Benchmark
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hybrid-search-engine-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.17.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: hybrid-search-engine-frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api

  # compose.yaml and the Caddyfile live in the gitignored deployment/ folder,
  # so CI can only verify that the production images still build.
  production-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t hybrid-search-backend:ci hybrid-search-engine
      - name: Build frontend image
        run: docker build -t hybrid-search-frontend:ci
          --build-arg NEXT_PUBLIC_API_BASE_URL=/api hybrid-search-engine-frontend

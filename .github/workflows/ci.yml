name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hybrid-search-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        # Install core + dev + metrics extras so all tests can run.
        # Phase 5 will switch this to: uv sync --frozen --extra dev --extra metrics
        run: python -m pip install -e ".[dev,metrics]"

      - name: Lint with ruff
        run: python -m ruff check src tests scripts Benchmark

      - name: Run tests
        run: pytest -q

[project]
name = "hybrid-search-engine"
version = "0.1.0"
description = "A hybrid neural search engine with BM25, vector search, and cross-encoder reranking"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",

    # BM25 keyword search
    "tantivy>=0.22.0",

    # Vector search
    "faiss-cpu>=1.7.4",

    # Embeddings & reranking
    "sentence-transformers>=2.3.0",
    "torch>=2.1.0",

    # Query understanding
    "symspellpy>=6.7.7",

    # Data processing
    "numpy>=1.26.0",
    "tqdm>=4.66.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Observability — install with: pip install -e ".[metrics]"
# prometheus_client is optional; the API degrades gracefully if absent.
metrics = [
    "prometheus-client>=0.20.0",
]

dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",       # FastAPI TestClient
    "ruff>=0.1.14",        # Linter
    "locust>=2.20.0",      # Load testing
]

# Removed from core (were declared but never used in application code):
#   lightgbm        — LTR model never built
#   sqlalchemy      — replaced by SQLite docstore
#   asyncpg         — no async Postgres
#   psycopg2-binary — no Postgres at all
#   redis           — no caching layer
#   nltk            — not used
#   pandas          — not used in application code (only in old notebooks)
#
# Removed from dev:
#   pytest-asyncio  — no async tests
#   jupyter         — not part of CI or tests
#   matplotlib      — not part of CI or tests
#   scikit-learn    — metrics are in src/evaluation/metrics.py (stdlib only)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
